[project]
name = "contract-clause-qlora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.29.0",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "scikit-learn>=1.9.0",
    "torch>=2.6.0",
    "transformers>=5.16.1",
    "trl>=1.12.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_clause_qlora"]
